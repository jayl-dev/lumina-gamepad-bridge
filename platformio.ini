; Lumina ESP32-S3 USB gamepad bridge
; Native USB (USB-OTG / TinyUSB) is required so the board can be a HID gamepad
; and a CDC serial port at the same time.
;
; One firmware for every emulated controller (generic joystick, DualShock 4, Switch Pro).
; The controller is chosen at runtime (BOOT button, tester, Keypad or tools/set_profile.py)
; and remembered across power cycles.

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
; Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5): its newer TinyUSB fixes HID reports being corrupted
; while the CDC link receives data, which broke the 2.0.17 / TinyUSB 0.16 core.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The firmware reboots into the ROM bootloader when its serial port is opened at 1200 bps
; (the DTR/RTS reset esptool normally uses is disabled), then esptool flashes over the
; ROM's own USB port.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; The board default is USB-Serial-JTAG mode (ARDUINO_USB_MODE=1), which cannot do HID.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Controller used until one is chosen: 0 generic, 1 DualShock 4, 2 Switch Pro (default)
    ; -DLUMINA_DEFAULT_PROFILE=2
    ; DevKitC-1 v1.1 boards wire the onboard RGB LED to GPIO 38 instead of GPIO 48:
    ; -DSTATUS_LED_PIN=38

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Iinclude
