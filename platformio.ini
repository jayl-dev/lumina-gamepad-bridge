; Lumina ESP32-S3 USB gamepad bridge
; Native USB (USB-OTG / TinyUSB) is required so the board can be a HID gamepad
; and a CDC serial port at the same time.

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The board default is USB-Serial-JTAG mode (ARDUINO_USB_MODE=1), which cannot do HID.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
